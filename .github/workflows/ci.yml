name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the version from git history, so it needs full depth.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Net.Tools.sln

      - name: Build
        run: dotnet build src/Net.Tools.sln --no-restore -c Release

      - name: Test
        run: dotnet test src/Net.Tools.sln --no-build -c Release
