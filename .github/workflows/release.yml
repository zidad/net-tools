name: Release

# Every merge to main publishes an auto-incremented prerelease (e.g. 0.2.1-alpha.0.5).
# Pushing a `v*` tag publishes the matching stable version (e.g. v0.3.0 -> 0.3.0).
#
# Publishing uses nuget.org Trusted Publishing (OIDC) — there is no API key secret.
# The trusted publishing policy on nuget.org is bound to this repository and to this
# workflow file *by name*, so renaming this file breaks publishing until the policy
# is updated. See https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to request the GitHub OIDC token
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the version from tags and commit height, so it needs
          # the full history and all tags.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Net.Tools.sln

      - name: Build
        run: dotnet build src/Net.Tools.sln --no-restore -c Release

      - name: Test
        run: dotnet test src/Net.Tools.sln --no-build -c Release

      - name: Pack
        run: dotnet pack src/Net.Core/Net.Core.csproj --no-build -c Release -o artifacts

      - name: Show resolved version
        run: ls -1 artifacts

      # Requested immediately before the push: the issued key is only valid for 1 hour.
      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: zidad

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
